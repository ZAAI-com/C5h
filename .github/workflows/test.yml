name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run bun lint
        run: bun lint

      - name: Run bun test:run
        run: bun test:run

      - name: Run bun run build
        run: bun run build

      - name: Run cargo test
        run: cd src-tauri && cargo test --all-features

      - name: Run cargo check
        run: cd src-tauri && cargo check --all-features

      - name: Run cargo clippy
        run: cd src-tauri && cargo clippy --all-features -- -D warnings

  release-build-invariant:
    name: Release build cannot link dev capability
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: release-build-invariant

      - name: Seed stale dev capability
        run: |
          mkdir -p src-tauri/capabilities
          printf '{"identifier":"stale","windows":["main"],"permissions":["pilot:default"]}' \
            > src-tauri/capabilities/dev.json

      - name: Build without e2e feature
        run: cd src-tauri && cargo build --no-default-features

      - name: Assert dev capability removed
        run: |
          if [ -f src-tauri/capabilities/dev.json ]; then
            echo "::error::src-tauri/capabilities/dev.json was not removed by build.rs"
            echo "A leftover dev.json links the unauthenticated tauri-pilot socket into release builds."
            exit 1
          fi
