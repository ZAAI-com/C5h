name: S2 - Release GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (strict semver, no v prefix, e.g. 0.5.0)"
        required: true
        type: string
      build_number:
        description: "Globally increasing build number (positive integer, e.g. 5)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease (excluded from releases/latest; build number remains globally reserved)"
        required: false
        type: boolean
        default: false
      first_sparkle_release:
        description: "Allow a missing feed only for the first stable release that publishes appcast.xml"
        required: false
        type: boolean
        default: false

concurrency:
  group: c5h-s2-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, notarize, and publish DMG
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release identifiers
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          FIRST_SPARKLE_RELEASE: ${{ inputs.first_sparkle_release }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./Toolkit/Release/validate-release-identifiers.sh \
            "$VERSION" \
            "$BUILD_NUMBER" \
            "$PRERELEASE" \
            "$FIRST_SPARKLE_RELEASE"

      - name: Require release credentials
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release credentials:$missing"
            exit 1
          fi

      - name: Select latest Xcode
        run: |
          latest=$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -n1)
          [ -e "$latest" ] && sudo xcode-select -s "$latest" || true
          xcodebuild -version

      - name: Import Developer ID certificate into a temp keychain
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="c5h-build.keychain"
          CERT_DIR="$(mktemp -d -t c5h-cert)"
          # Use a .p12 extension and an explicit -f pkcs12 below: without both,
          # `security import` cannot infer the format and fails with
          # "SecKeychainItemImport: Unknown format in import" even for a valid p12.
          CERT_FILE="$CERT_DIR/cert.p12"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" "$(security list-keychains -d user | tr -d '"')"

          printf '%s' "$APPLE_DEVELOPER_CERTIFICATE_P12" | base64 -D > "$CERT_FILE"
          security import "$CERT_FILE" \
            -f pkcs12 \
            -k "$KEYCHAIN_NAME" \
            -P "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME" >/dev/null
          rm -rf "$CERT_DIR"

      - name: Build, sign, notarize, and DMG
        env:
          DEVELOPER_ID_APPLICATION: "Developer ID Application: ${{ vars.APPLE_SIGNING_IDENTITY }}"
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./Toolkit/Release/release.sh "${{ inputs.version }}" "${{ inputs.build_number }}"

      - name: Generate and sign Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./Toolkit/Release/appcast.sh "${{ inputs.version }}" "${{ inputs.build_number }}"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain c5h-build.keychain || true

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            build/C5h-${{ inputs.version }}.dmg
            build/C5h-${{ inputs.version }}.dmg.sha256
            build/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
