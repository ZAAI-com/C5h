name: S2 - Release GitHub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (strict semver, no v prefix, e.g. 0.5.0)"
        required: true
        type: string
      build_number:
        description: "Globally increasing build number (positive integer, e.g. 5)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease (kept out of latest and the appcast feed)"
        required: false
        type: boolean
        default: false
      first_sparkle_release:
        description: "Allow a missing feed only for the first stable release that publishes appcast.xml"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, notarize, and publish DMG
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release identifiers
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          FIRST_SPARKLE_RELEASE: ${{ inputs.first_sparkle_release }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be strict semver, no leading zeros (e.g. 0.5.0). Got: $VERSION"
            exit 1
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Build number must be a positive integer (e.g. 5). Got: $BUILD_NUMBER"
            exit 1
          fi
          # Guard against a lower or reused build number silently replacing the
          # latest feed with an update higher-build Sparkle clients would never
          # install (Sparkle only upgrades to a strictly greater sparkle:version).
          # Compare against the highest build already in the published feed. A
          # fetch or parse failure is fatal unless this is the explicitly
          # validated first stable release that will publish an appcast.
          appcast_file=$(mktemp)
          trap 'rm -f "$appcast_file"' EXIT
          feed_status="fetch failed"
          published=""
          if curl -fsSL "https://github.com/ZAAI-com/C5h/releases/latest/download/appcast.xml" \
            -o "$appcast_file"; then
            feed_status="contained no parseable sparkle:version"
            published=$(perl -ne 'while (/sparkle:version="([0-9]+)"/g) { print "$1\n" }' "$appcast_file" \
              | sort -n | tail -n1)
          fi
          if [ -n "${published:-}" ]; then
            if [ "$FIRST_SPARKLE_RELEASE" = "true" ]; then
              echo "The first_sparkle_release override is unnecessary because the published appcast was verified. Disable the override and rerun."
              exit 1
            fi
            if [ "$BUILD_NUMBER" -le "$published" ]; then
              echo "Build number must be strictly greater than the highest published build ($published); a lower or reused number poisons the Sparkle feed. Got: $BUILD_NUMBER"
              exit 1
            fi
          else
            if [ "$FIRST_SPARKLE_RELEASE" != "true" ]; then
              echo "Could not verify the published appcast build number: $feed_status. Refusing to skip the monotonic build-number check."
              exit 1
            fi
            if [ "$PRERELEASE" = "true" ]; then
              echo "The first Sparkle release must be stable so releases/latest serves its appcast. Disable prerelease and rerun."
              exit 1
            fi
            existing_appcasts=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .assets[]? | select(.name == "appcast.xml") | .browser_download_url')
            if [ -n "$existing_appcasts" ]; then
              echo "The first_sparkle_release override is invalid because a published appcast.xml asset already exists:"
              echo "$existing_appcasts"
              exit 1
            fi
            echo "::notice::Using the audited first_sparkle_release override; GitHub confirms that no published appcast.xml asset exists."
          fi

      - name: Require release credentials
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD SPARKLE_ED_PRIVATE_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required release credentials:$missing"
            exit 1
          fi

      - name: Select latest Xcode
        run: |
          latest=$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -n1)
          [ -e "$latest" ] && sudo xcode-select -s "$latest" || true
          xcodebuild -version

      - name: Import Developer ID certificate into a temp keychain
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_NAME="c5h-build.keychain"
          CERT_DIR="$(mktemp -d -t c5h-cert)"
          # Use a .p12 extension and an explicit -f pkcs12 below: without both,
          # `security import` cannot infer the format and fails with
          # "SecKeychainItemImport: Unknown format in import" even for a valid p12.
          CERT_FILE="$CERT_DIR/cert.p12"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" "$(security list-keychains -d user | tr -d '"')"

          printf '%s' "$APPLE_DEVELOPER_CERTIFICATE_P12" | base64 -D > "$CERT_FILE"
          security import "$CERT_FILE" \
            -f pkcs12 \
            -k "$KEYCHAIN_NAME" \
            -P "$APPLE_DEVELOPER_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME" >/dev/null
          rm -rf "$CERT_DIR"

      - name: Build, sign, notarize, and DMG
        env:
          DEVELOPER_ID_APPLICATION: "Developer ID Application: ${{ vars.APPLE_SIGNING_IDENTITY }}"
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./Toolkit/Release/release.sh "${{ inputs.version }}" "${{ inputs.build_number }}"

      - name: Generate and sign Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./Toolkit/Release/appcast.sh "${{ inputs.version }}" "${{ inputs.build_number }}"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain c5h-build.keychain || true

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            build/C5h-${{ inputs.version }}.dmg
            build/C5h-${{ inputs.version }}.dmg.sha256
            build/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
