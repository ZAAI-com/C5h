name: Update Homebrew Tap

# Run automatically when a Release is published, or manually with a version.
# Renders distribution/homebrew/c5h.rb with the published version + SHA256
# of the universal DMG, then commits to ZAAI-com/homebrew-tap's Casks/c5h.rb.
#
# Prerequisites (already configured):
#   1. Tap repo: github.com/ZAAI-com/homebrew-tap (with a `Casks/` dir).
#   2. Repository secret HOMEBREW_TAP_REPO_COMMIT_TOKEN: fine-grained PAT
#      scoped to that repo with Contents: read+write.
#
# After publishing a release, users install with:
#   brew install --cask zaai-com/tap/c5h
# (Homebrew strips the `homebrew-` prefix from the repo name when resolving
# the tap, so `homebrew-tap` becomes `zaai-com/tap`.)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.0). Omits the leading v.'
        required: true

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (cask template lives here)
        uses: actions/checkout@v4

      - name: Resolve version
        id: vars
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version. Pass `version` input or trigger from a release."
            exit 1
          fi
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/C5h_${VERSION}_universal.dmg"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_url=$DMG_URL" >> "$GITHUB_OUTPUT"

      - name: Download universal DMG and compute SHA256
        id: sha
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o c5h.dmg "${{ steps.vars.outputs.dmg_url }}"
          SHA=$(shasum -a 256 c5h.dmg | awk '{print $1}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved SHA256: $SHA"

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: ZAAI-com/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_REPO_COMMIT_TOKEN }}
          path: tap

      - name: Render cask into tap
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          sed \
            -e "s|VERSION_PLACEHOLDER|${{ steps.vars.outputs.version }}|g" \
            -e "s|SHA256_PLACEHOLDER|${{ steps.sha.outputs.sha }}|g" \
            distribution/homebrew/c5h.rb > tap/Casks/c5h.rb
          echo "--- Rendered cask ---"
          cat tap/Casks/c5h.rb

      - name: Commit and push to tap
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/c5h.rb
          if git diff --cached --quiet; then
            echo "No tap changes — cask already at v${{ steps.vars.outputs.version }}."
            exit 0
          fi
          git commit -m "Update c5h to v${{ steps.vars.outputs.version }}"
          git push
