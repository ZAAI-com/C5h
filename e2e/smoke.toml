[scenario]
name = "smoke"

[[step]]
name = "main window is on the dev URL"
action = "eval"
script = "if (location.hostname !== 'localhost') throw new Error('Expected localhost dev URL, got: ' + location.href)"

[[step]]
name = "page title is set"
action = "eval"
script = "document.title"

# The next steps assert that the primary navigation landmarks rendered.
# They use the M4 ARIA work: the tabs nav has aria-label="Primary" and
# every tab has an explicit aria-label matching the user-visible name.
# These selectors are stable across tailwind class changes.

[[step]]
name = "Primary nav landmark is present"
action = "assert-exists"
target = "nav[aria-label=\"Primary\"]"

[[step]]
name = "Calendar tab is reachable"
action = "assert-exists"
target = "[role=\"tab\"][aria-label=\"Calendar\"]"

[[step]]
name = "Settings tab is reachable"
action = "assert-exists"
target = "[role=\"tab\"][aria-label=\"Settings\"]"

[[step]]
name = "capture screenshot for review"
action = "screenshot"
path = "e2e/.artifacts/smoke.png"
