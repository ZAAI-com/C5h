[package]
name = "c5h"
version = "0.2.0"
description = "Visualize and optimize AI coding tool usage windows"
authors = ["ZAAI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "c5h_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core with tray icon support
tauri = { version = "2", features = ["tray-icon"] }

# Tauri plugins
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

# Logging
log = "0.4"
tauri-plugin-log = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (direct sqlx access for queries)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Process monitoring (for real-time CLI detection)
sysinfo = "0.32"

# Output parsing
regex = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process"] }

[dev-dependencies]
tempfile = "3"

